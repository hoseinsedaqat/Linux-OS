<!doctype html>
<html lang="en" data-theme="kali" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <meta
      name="description"
      content="NOVA Linux — a premium, interactive Linux desktop experience built with React and TypeScript. Boot, log in and explore a complete web-based operating system simulator."
    />
    <title>NOVA Linux — Web Desktop Experience</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%nova-logo.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%nova-logo.svg" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Paint the saved theme and accent before the bundle loads, so a profile on
      // Dark or Light never flashes the Kali skin first. Defensive by design: any
      // unexpected value simply falls through to the markup defaults above.
      (function () {
        try {
          var raw = localStorage.getItem('nova-linux.settings.v1');
          if (!raw) return;
          var saved = JSON.parse(raw).state || {};
          var html = document.documentElement;
          if (saved.theme === 'kali' || saved.theme === 'dark' || saved.theme === 'light') {
            html.dataset.theme = saved.theme;
          }
          if (typeof saved.accent === 'string' && /^[a-z]{3,12}$/.test(saved.accent)) {
            html.dataset.accent = saved.accent;
          }
          if (saved.theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#e8edf3');
          }
        } catch (error) {
          /* ignore: defaults are already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NOVA Linux is an interactive desktop simulator and requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
