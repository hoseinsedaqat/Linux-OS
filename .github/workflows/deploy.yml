name: Deploy NOVA Linux to GitHub Pages

on:
  push:
    # `test` is this repository's default branch; `main` is listed so the same
    # workflow keeps working if the repository is later renamed/standardised.
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test 2>&1 | tee /tmp/vitest.log

      - name: Test failure report
        if: failure()
        run: |
          if [ -f /tmp/vitest.log ]; then
            sed -e 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log \
              | grep -A8 -E "Unhandled Error|AssertionError|FAIL " \
              | head -45 | while IFS= read -r line; do
                safe=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-900)
                echo "::error title=Vitest::$safe"
              done
          fi

      # Gives a red run a human-readable reason instead of a bare 404 from the
      # Pages API: the repository owner has to enable Pages once.
      - name: Check GitHub Pages status
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages -> Build and deployment -> Source: GitHub Actions, then re-run this workflow. The build itself is ready and will publish to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

      - name: Build
        env:
          # Project pages are served from /<repo>/ so the base path must match.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # Tries to create the Pages site on the very first run. This needs admin
      # rights the workflow token does not have, so it must never fail the job:
      # if it cannot be created here, the repository setting has to be flipped
      # once under Settings -> Pages -> Source: GitHub Actions.
      - name: Configure Pages (best effort enablement)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
