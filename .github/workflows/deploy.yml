name: Deploy NOVA Linux to GitHub Pages

on:
  push:
    # `test` is this repository's default branch; `main` is listed so the same
    # workflow keeps working if the repository is later renamed/standardised.
    # NOTE: the working branch is listed temporarily so CI can be validated on it.
    branches: [main, test, arena/44d1638d-linux-os]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test 2>&1 | tee /tmp/vitest.log

      - name: Build
        env:
          # Project pages are served from /<repo>/ so the base path must match.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run if it does not exist yet.
          enablement: true

      - name: Test failure report
        if: failure()
        run: |
          if [ -f /tmp/vitest.log ]; then
            grep -E "FAIL|AssertionError|Error:|× |Unhandled" /tmp/vitest.log | head -40 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr '\n' ' ' | cut -c1-900)
              echo "::error title=Vitest::$safe"
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
