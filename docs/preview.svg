<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Schematic of the NOVA Linux desktop: wallpaper, desktop icons, a Writer window and a bottom panel">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090e"/>
      <stop offset="0.55" stop-color="#071019"/>
      <stop offset="1" stop-color="#04070b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#3c8cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.55" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#8c5aff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8c5aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#070c11" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="tileMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ef0ad"/>
      <stop offset="1" stop-color="#22a97a"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fbaff"/>
      <stop offset="1" stop-color="#2f7bd8"/>
    </linearGradient>
    <linearGradient id="tileViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49bff"/>
      <stop offset="1" stop-color="#6b4fd6"/>
    </linearGradient>
    <linearGradient id="tileAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="1" stop-color="#d99b25"/>
    </linearGradient>
    <linearGradient id="tileRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9db0"/>
      <stop offset="1" stop-color="#cf4f67"/>
    </linearGradient>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <filter id="panelBlur" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <style>
      .ui { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .label { font-size: 12px; fill: #eef3f8; }
      .muted { font-size: 11px; fill: #9fb0c2; }
      .tile-label { font-size: 11px; fill: #e9f0f7; }
      .win-title { font-size: 12px; fill: #d7e2ee; }
      .body { font-size: 12px; fill: #33414f; }
      .head { font-size: 19px; fill: #1b2833; font-weight: 700; }
    </style>
  </defs>

  <!-- wallpaper -->
  <rect width="1280" height="760" fill="url(#wall)"/>
  <rect width="1280" height="760" fill="url(#glowA)"/>
  <rect width="1280" height="760" fill="url(#glowB)"/>
  <rect width="1280" height="760" fill="url(#glowC)"/>

  <!-- desktop icons -->
  <g class="ui">
    <g transform="translate(24 22)">
      <rect width="44" height="44" rx="12" fill="url(#tileAmber)"/>
      <path d="M13 17h18l-2 13H15z" fill="#3b2a0a" opacity="0.55"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Files</text>
    </g>
    <g transform="translate(24 108)">
      <rect width="44" height="44" rx="12" fill="url(#tileBlue)"/>
      <circle cx="22" cy="22" r="10" fill="none" stroke="#08304f" stroke-width="2" opacity="0.6"/>
      <path d="M12 22h20M22 12c5 6 5 14 0 20M22 12c-5 6-5 14 0 20" stroke="#08304f" stroke-width="1.4" fill="none" opacity="0.55"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Browser</text>
    </g>
    <g transform="translate(24 194)">
      <rect width="44" height="44" rx="12" fill="url(#tileViolet)"/>
      <rect x="13" y="13" width="18" height="18" rx="3" fill="none" stroke="#150a34" stroke-width="2" opacity="0.6"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Writer</text>
    </g>
    <g transform="translate(24 280)">
      <rect width="44" height="44" rx="12" fill="url(#tileMint)"/>
      <rect x="13" y="13" width="18" height="18" rx="3" fill="none" stroke="#052b1d" stroke-width="2" opacity="0.7"/>
      <path d="M17 18h10M17 22h10M17 26h6" stroke="#052b1d" stroke-width="1.6" opacity="0.7"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Calc</text>
    </g>
    <g transform="translate(24 366)">
      <rect width="44" height="44" rx="12" fill="url(#tileRose)"/>
      <circle cx="22" cy="20" r="6" fill="none" stroke="#3a0b16" stroke-width="2" opacity="0.6"/>
      <path d="M12 32c3-6 17-6 20 0" fill="none" stroke="#3a0b16" stroke-width="2" opacity="0.6"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Accounting</text>
    </g>
    <g transform="translate(24 452)">
      <rect width="44" height="44" rx="12" fill="#6f8099"/>
      <path d="M16 17h12l-1.5 18h-9z" fill="none" stroke="#0d151d" stroke-width="2" opacity="0.7"/>
      <text x="22" y="66" class="tile-label" text-anchor="middle">Trash</text>
    </g>
  </g>

  <!-- Writer window -->
  <g class="ui" filter="url(#winShadow)">
    <rect x="300" y="64" width="760" height="560" rx="12" fill="#0e151d" stroke="rgba(255,255,255,0.16)"/>
    <rect x="300" y="64" width="760" height="38" rx="12" fill="#161f29"/>
    <rect x="300" y="90" width="760" height="12" fill="#0e151d"/>
    <rect x="316" y="76" width="16" height="16" rx="5" fill="#6d8dff"/>
    <text x="340" y="89" class="win-title">Writer — Quarterly report.novadoc</text>
    <circle cx="1010" cy="83" r="4.5" fill="#7f8fa3"/>
    <rect x="1026" y="79" width="9" height="9" rx="2" fill="#7f8fa3"/>
    <path d="M1046 79l9 9M1055 79l-9 9" stroke="#7f8fa3" stroke-width="1.6"/>

    <!-- toolbar -->
    <rect x="300" y="102" width="760" height="40" fill="#0f1720"/>
    <g fill="#93a4b8">
      <rect x="316" y="114" width="14" height="14" rx="3"/>
      <rect x="338" y="114" width="14" height="14" rx="3"/>
      <rect x="360" y="114" width="14" height="14" rx="3"/>
      <rect x="390" y="114" width="1" height="18" opacity="0.3"/>
      <rect x="400" y="116" width="46" height="11" rx="3" opacity="0.6"/>
      <rect x="456" y="114" width="30" height="14" rx="3" opacity="0.45"/>
      <rect x="496" y="114" width="30" height="14" rx="3" opacity="0.45"/>
      <rect x="536" y="114" width="30" height="14" rx="3" opacity="0.45"/>
    </g>

    <!-- page -->
    <rect x="396" y="158" width="592" height="418" rx="3" fill="#fdfdfb"/>
    <text x="432" y="206" class="head">Quarterly report</text>
    <text x="432" y="232" class="body" opacity="0.75">Prepared inside NOVA Linux — a web desktop simulator.</text>
    <g fill="#c3ccd6">
      <rect x="432" y="256" width="516" height="9" rx="4"/>
      <rect x="432" y="274" width="500" height="9" rx="4"/>
      <rect x="432" y="292" width="470" height="9" rx="4"/>
      <rect x="432" y="322" width="516" height="9" rx="4"/>
      <rect x="432" y="340" width="420" height="9" rx="4"/>
    </g>
    <rect x="432" y="376" width="516" height="1" fill="#dfe5ec"/>
    <g fill="#aab6c4" opacity="0.9">
      <rect x="432" y="396" width="120" height="8" rx="4"/>
      <rect x="432" y="422" width="150" height="8" rx="4"/>
      <rect x="432" y="448" width="96" height="8" rx="4"/>
    </g>
    <!-- status bar -->
    <rect x="300" y="586" width="760" height="38" fill="#0f1720"/>
    <text x="316" y="609" class="muted">312 words · 1,884 characters</text>
    <rect x="940" y="598" width="104" height="16" rx="8" fill="rgba(61,220,151,0.16)"/>
    <text x="992" y="610" class="muted" text-anchor="middle" fill="#3ddc97">Saved locally</text>
  </g>

  <!-- panel -->
  <g class="ui">
    <rect x="0" y="706" width="1280" height="54" fill="url(#panelGrad)"/>
    <rect x="0" y="706" width="1280" height="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="12" y="717" width="128" height="32" rx="8" fill="rgba(61,220,151,0.16)"/>
    <circle cx="32" cy="733" r="11" fill="url(#tileMint)"/>
    <text x="28" y="737" class="label" font-weight="700" fill="#05140d">N</text>
    <text x="50" y="737" class="label" fill="#3ddc97">Applications</text>
    <rect x="152" y="717" width="30" height="32" rx="8" fill="rgba(255,255,255,0.05)"/>
    <rect x="186" y="717" width="30" height="32" rx="8" fill="rgba(255,255,255,0.05)"/>

    <!-- pinned + tasks -->
    <g>
      <rect x="420" y="717" width="30" height="32" rx="8" fill="rgba(255,255,255,0.05)"/>
      <rect x="432" y="727" width="7" height="12" rx="2" fill="#6d8dff"/>
      <rect x="458" y="717" width="30" height="32" rx="8" fill="rgba(255,255,255,0.05)"/>
      <rect x="468" y="727" width="10" height="10" rx="2" fill="#3fbf7f"/>
      <rect x="496" y="717" width="152" height="32" rx="8" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.08)"/>
      <rect x="506" y="726" width="14" height="14" rx="4" fill="#6d8dff"/>
      <text x="528" y="736" class="label">Quarterly report…</text>
      <rect x="612" y="744" width="22" height="2" rx="1" fill="#3ddc97"/>
    </g>

    <!-- tray -->
    <g fill="#b3c0d0">
      <path d="M940 730a10 10 0 0114 0" stroke="#b3c0d0" stroke-width="1.8" fill="none"/>
      <circle cx="947" cy="734" r="1.8"/>
      <path d="M976 724v8h9l4 5v-16z" fill="#b3c0d0" opacity="0.85"/>
      <rect x="1006" y="726" width="18" height="10" rx="3" fill="none" stroke="#b3c0d0" stroke-width="1.6"/>
      <rect x="1026" y="729" width="2" height="4" rx="1" fill="#b3c0d0"/>
      <circle cx="1056" cy="731" r="7" fill="none" stroke="#b3c0d0" stroke-width="1.6"/>
    </g>
    <text x="1096" y="729" class="label" text-anchor="end">09:41</text>
    <text x="1096" y="743" class="muted" text-anchor="end">Mon, 27 Oct</text>
    <circle cx="1140" cy="729" r="10" fill="#ff6b81"/>
    <text x="1140" y="733" class="label" text-anchor="middle" font-size="10" font-weight="700">2</text>
    <circle cx="1196" cy="733" r="12" fill="#93a4b8"/>
    <text x="1196" y="737" class="label" text-anchor="middle" font-size="10" font-weight="700" fill="#0b1219">N</text>
  </g>

  <text x="1280" y="748" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#4a5b6d">Schematic drawn from the app's own design tokens — not a screenshot</text>
</svg>
